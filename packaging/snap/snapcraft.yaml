name: slskr
base: core22
version: '0.2.41'
summary: Rust Soulseek daemon with bundled Web UI
description: |
  slskR is a Rust Soulseek client and daemon with a local web interface.
grade: stable
confinement: strict
architectures:
  - build-on: [amd64]
    build-for: [amd64]
  - build-on: [amd64, arm64]
    build-for: [arm64]

apps:
  slskr:
    command: slskr
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      SLSKR_CONFIG: $SNAP_USER_COMMON/config.toml

parts:
  slskr:
    plugin: dump
    source:
      - on amd64: https://github.com/snapetech/slskr/releases/download/release-v0.2.41/slskr-v0.2.41-x86_64-unknown-linux-gnu.tar.gz
      - on arm64: https://github.com/snapetech/slskr/releases/download/release-v0.2.41/slskr-v0.2.41-aarch64-unknown-linux-gnu.tar.gz
    source-type: file
    override-pull: |
      craftctl default
      case "${CRAFT_ARCH_BUILD_FOR:-${SNAPCRAFT_ARCH_BUILD_FOR:-}}" in
        amd64)
          archive="slskr-v0.2.41-x86_64-unknown-linux-gnu.tar.gz"
          expected="0c782ada01d2bf99755ed406fbabae574eafa1b1148fbb377b3642d2178e688f"
          ;;
        arm64)
          archive="slskr-v0.2.41-aarch64-unknown-linux-gnu.tar.gz"
          expected="6e92864e6aaaa6537da49f1ba0f6852644a5b53fa0ad53f5890273f7155f7121"
          ;;
        *)
          echo "unsupported Snap architecture: ${CRAFT_ARCH_BUILD_FOR:-${SNAPCRAFT_ARCH_BUILD_FOR:-}}" >&2
          exit 1
          ;;
      esac
      archive_path="$CRAFT_PART_SRC/$archive"
      test -f "$archive_path"
      printf '%s  %s\n' "$expected" "$archive_path" | sha256sum --check --status
      tar -xzf "$archive_path" -C "$CRAFT_PART_SRC" --strip-components=1
      rm -f "$archive_path"
