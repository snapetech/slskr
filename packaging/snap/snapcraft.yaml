name: slskr
base: core22
version: '0.2.15'
summary: Rust Soulseek daemon with bundled Web UI
description: |
  slskR is a Rust Soulseek client and daemon with a local web interface.
grade: stable
confinement: strict
architectures:
  - amd64

apps:
  slskr:
    command: slskr
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      SLSKR_CONFIG: $SNAP_USER_COMMON/config.toml

parts:
  slskr:
    plugin: dump
    source: https://github.com/snapetech/slskr/releases/download/release-v0.2.15/slskr-v0.2.15-x86_64-unknown-linux-gnu.tar.gz
    source-checksum: sha256/719ed6b26b34ec51ac45370cef64ab8dd5cf85b1f56d18f8ba38b126296a814e
