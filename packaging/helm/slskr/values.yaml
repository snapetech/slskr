image:
  repository: ghcr.io/snapetech/slskr
  tag: "0.2.38"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 5030

env:
  SLSKR_CONFIG: /app/config/config.toml
  SLSKR_HTTP_BIND: 0.0.0.0:5030
  SLSKR_STATE_DIR: /var/lib/slskr

persistence:
  config:
    enabled: true
    size: 1Gi
  downloads:
    enabled: true
    size: 10Gi
  incomplete:
    enabled: true
    size: 5Gi
  shares:
    enabled: true
    size: 10Gi
    readOnly: true
  state:
    enabled: true
    size: 5Gi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

resources: {}
