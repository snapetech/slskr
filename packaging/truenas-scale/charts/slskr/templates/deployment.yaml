apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-slskr
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: slskr
  template:
    metadata:
      labels:
        app: slskr
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
      containers:
        - name: slskr
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
          ports:
            - name: http
              containerPort: 5030
          env:
            - name: SLSKR_CONFIG
              value: {{ .Values.env.SLSKR_CONFIG | quote }}
            - name: SLSKR_HTTP_BIND
              value: {{ .Values.env.SLSKR_HTTP_BIND | quote }}
            - name: SLSKR_STATE_DIR
              value: {{ .Values.env.SLSKR_STATE_DIR | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: downloads
              mountPath: /app/downloads
            - name: incomplete
              mountPath: /app/incomplete
            - name: shares
              mountPath: /app/shares
            - name: state
              mountPath: /var/lib/slskr
      volumes:
        - name: config
          hostPath:
            path: {{ .Values.persistence.config.hostPath }}
            type: DirectoryOrCreate
        - name: downloads
          hostPath:
            path: {{ .Values.persistence.downloads.hostPath }}
            type: DirectoryOrCreate
        - name: incomplete
          hostPath:
            path: {{ .Values.persistence.incomplete.hostPath }}
            type: DirectoryOrCreate
        - name: shares
          hostPath:
            path: {{ .Values.persistence.shares.hostPath }}
            type: DirectoryOrCreate
        - name: state
          hostPath:
            path: {{ .Values.persistence.state.hostPath }}
            type: DirectoryOrCreate
