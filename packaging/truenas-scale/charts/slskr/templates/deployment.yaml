apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-slskr
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: slskr
  template:
    metadata:
      labels:
        app: slskr
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
      containers:
        - name: slskr
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
          ports:
            - name: http
              containerPort: 5030
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: downloads
              mountPath: /app/downloads
            - name: incomplete
              mountPath: /app/incomplete
            - name: shares
              mountPath: /app/shares
      volumes:
        - name: config
          hostPath:
            path: {{ .Values.persistence.config.hostPath }}
            type: DirectoryOrCreate
        - name: downloads
          hostPath:
            path: {{ .Values.persistence.downloads.hostPath }}
            type: DirectoryOrCreate
        - name: incomplete
          hostPath:
            path: {{ .Values.persistence.incomplete.hostPath }}
            type: DirectoryOrCreate
        - name: shares
          hostPath:
            path: {{ .Values.persistence.shares.hostPath }}
            type: DirectoryOrCreate
