app-id: io.github.slskd.slskr
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: slskr-wrapper

finish-args:
  - --share=network
  - --filesystem=xdg-download
  - --filesystem=xdg-music
  - --filesystem=~/.config/slskr:create
  - --filesystem=~/.local/share/slskr:create

modules:
  - name: slskr
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/lib/slskr
      - cp -r . /app/lib/slskr/
      - |
        cat > /app/bin/slskr-wrapper <<'EOF'
        #!/usr/bin/env bash
        set -e
        CONFIG_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/slskr"
        mkdir -p "$CONFIG_DIR"
        if [ ! -f "$CONFIG_DIR/config.toml" ]; then
          printf '%s\n' '[web]' 'port = 5030' > "$CONFIG_DIR/config.toml"
        fi
        exec /app/lib/slskr/slskr serve --config "$CONFIG_DIR/config.toml"
        EOF
      - chmod +x /app/bin/slskr-wrapper
    sources:
      - type: archive
        url: https://github.com/snapetech/slskr/releases/download/release-v0.2.40/slskr-v0.2.40-x86_64-unknown-linux-gnu.tar.gz
        sha256: dda79c3694f76f1b9fa547d91310bdc7b9407c77bf33c812e3ea0485bd7dcaff
        only-arches: [x86_64]
      - type: archive
        url: https://github.com/snapetech/slskr/releases/download/release-v0.2.40/slskr-v0.2.40-aarch64-unknown-linux-gnu.tar.gz
        sha256: 405eaadb27a603890619927b9bddf1b4c1c59573c77a86b24c9095a16aae9ecc
        only-arches: [aarch64]
