[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.flake8]
max-line-length = 88
extend-exclude = [".venv", "build", "dist", "*.egg-info"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = false
no_implicit_optional = false
