name: Windows Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "web/**"
      - "dashboard/**"
      - "client-ts/**"
      - ".github/workflows/windows-smoke.yml"

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Enable Windows long paths for Git dependencies
        run: git config --global core.longpaths true

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown

      - name: Clear Unix compiler wrapper
        shell: pwsh
        run: |
          'RUSTC_WRAPPER=' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CARGO_BUILD_RUSTC_WRAPPER=' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            dashboard/package-lock.json
            client-ts/package-lock.json

      - name: Rust build guard
        shell: bash
        run: scripts/check-rust-build-guard.sh

      - name: Rust build guard lock regression
        shell: bash
        run: scripts/test-rust-build-guard.sh

      - name: Process memory guard
        shell: bash
        run: scripts/check-process-memory-guard.sh

      - name: Process memory guard regression
        shell: bash
        run: scripts/test-process-memory-guard.sh

      - name: Rust fmt
        shell: bash
        run: scripts/check-rust-format.sh

      - name: Rust tests
        shell: bash
        run: scripts/with-build-guard.sh cargo test --workspace

      - name: WASM check
        shell: bash
        run: scripts/with-build-guard.sh cargo check -p slskr-web --target wasm32-unknown-unknown

      - name: Web build
        run: |
          npm --prefix web ci --allow-git=root --legacy-peer-deps --no-audit --no-fund
          npm --prefix web run build
