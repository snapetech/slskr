[build]
# The daemon is intentionally a large crate. Keep Cargo from compiling several
# Rust crates at once and multiplying LLVM's working set on smaller machines.
jobs = 1

[profile.dev]
# The controller source is large enough that retaining full debug metadata is
# needlessly expensive during ordinary edit/test cycles.
debug = 0

[profile.release]
opt-level = 3
# Thin LTO keeps cross-crate optimization without asking LLVM to hold the
# entire dependency graph in one fat-LTO job.
lto = "thin"
codegen-units = 16
debug = 0
strip = "symbols"

# The daemon's startup graph exceeds the PE default stack reserve on Windows
# before its HTTP listener is created.  Reserve the same stack size used by
# the Windows smoke child environment so the executable can start reliably.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:16777216"]
